 services:
   database:
     image: mysql:9.6
     environment:
       MYSQL_DATABASE: transactional
       MYSQL_ROOT_PASSWORD: root
       MYSQL_USER: app
       MYSQL_PASSWORD: app
     ports:
       - "3307:3306"
     volumes:
       - transactional_data:/user/lib/myslq
     healthcheck:
       test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uapp", "-papp"]
       interval: 5s
       timeout: 5s
       retries: 5

volumes:
  transaction_date: